name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build (cake build)
        run: npm run build

      - name: Verify no uncommitted changes in build output
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Build produced uncommitted changes. Run 'cake build' locally and commit the result."
            git status
            exit 1
          fi

  commit:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build (cake build)
        run: npm run build

      - name: Commit build output
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Build generated files